<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* ===== FAKE CANVAS PAGE ===== */
    #fakePage {
      background: #f5f5f5;
      height: 100vh;
    }

    .canvas-top {
      background: #c8102e;
      color: white;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .canvas-sidebar {
      width: 220px;
      background: white;
      height: calc(100vh - 50px);
      float: left;
      border-right: 1px solid #ccc;
      padding: 15px;
    }

    .canvas-sidebar div {
      margin-bottom: 15px;
      color: #333;
    }

    .canvas-content {
      margin-left: 220px;
      padding: 20px;
    }

    /* ===== REAL SITE ===== */
    #realSite {
      display: none;
      background: #0f0f0f;
      color: white;
      min-height: 100vh;
    }

    .navbar {
      background: #181818;
      padding: 15px;
    }

    .navbar a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .content {
      padding: 20px;
    }

    .discord-btn {
      display: inline-block;
      padding: 12px 20px;
      background: #5865F2;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<!-- 🎭 FAKE CANVAS -->
<div id="fakePage">
  <div class="canvas-top">Canvas</div>

  <div class="canvas-sidebar">
    <div>Dashboard</div>
    <div>Courses</div>
    <div>Calendar</div>
    <div>Inbox</div>
    <div>History</div>
  </div>

  <div class="canvas-content">
    <h2>Welcome to Canvas</h2>
    <p>Loading your courses...</p>
  </div>
</div>

<!-- 🚀 REAL SITE -->
<div id="realSite">
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="music.html">Music</a>
  </div>

  <div class="content">
    <h1>beta v bet</h1>
    <p>Welcome.</p>

    <a href="https://discord.gg/qVdrUfdhhn" target="_blank" class="discord-btn">
      Join Discord
    </a>
  </div>
</div>

<!-- 🔥 SWITCH SCRIPT -->
<script>
setTimeout(() => {
  document.getElementById("fakePage").style.display = "none";
  document.getElementById("realSite").style.display = "block";
  document.title = "beta v bet";
}, 3000);
</script>

</body>
</html>
