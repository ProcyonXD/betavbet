<!DOCTYPE html>
<html>
<head>
  <title>Music - beta v bet</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial;
    }

    .navbar {
      background: #181818;
      padding: 15px;
    }

    .navbar a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    input {
      width: 300px;
      padding: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 10px 15px;
      background: #6c2bd9;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      margin-left: 10px;
    }

    iframe {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="navbar">
  <a href="index.html">Home</a>
  <a href="games.html">Games</a>
  <a href="music.html">Music</a>
</div>

<div class="container">
  <h2>Play SoundCloud Music</h2>

  <input id="songUrl" placeholder="Paste SoundCloud track link">
  <button onclick="playSong()">Play</button>

  <iframe id="player"></iframe>
</div>

<script>
function playSong() {
  const url = document.getElementById("songUrl").value;

  if (!url.includes("soundcloud.com")) {
    alert("Enter a valid SoundCloud link");
    return;
  }

  const embed =
    "https://w.soundcloud.com/player/?url=" +
    encodeURIComponent(url);

  document.getElementById("player").src = embed;
}
</script>

</body>
</html>
